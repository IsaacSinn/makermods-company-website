name: Maker Arm checkout

on:
  push:
    paths:
      - maker-arm-buy.html
      - scripts/verify-maker-arm-checkout.mjs
      - .github/workflows/maker-arm-checkout.yml
  pull_request:
    paths:
      - maker-arm-buy.html
      - scripts/verify-maker-arm-checkout.mjs
      - .github/workflows/maker-arm-checkout.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-maker-arm-checkout.mjs
